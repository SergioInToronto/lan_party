<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDOBASH '26</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'base': '#121212',
            'surface': '#1E1E1E',
            'border-c': '#333333',
            'text-primary': '#E0E0E0',
            'text-muted': '#8A8A8A',
            'accent-orange': '#E95420',
            'accent-blue': '#1793D1',
            'accent-green': '#87A556',
          },
          fontFamily: {
            'ubuntu': ['Ubuntu', 'sans-serif'],
            'roboto': ['Roboto', 'DejaVu Sans', 'sans-serif'],
            'mono': ['Fira Code', 'Liberation Mono', 'monospace'],
          },
          borderRadius: {
            'kit': '2px',
          }
        }
      }
    }
  </script>
  <!-- Line Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-base text-text-primary min-h-screen flex flex-col">

  <nav-bar current-page="home"></nav-bar>

  <!-- ===== LOGIN MODAL ===== -->
  <login-modal></login-modal>

  <!-- ===== PREFERENCES MODAL ===== -->
  <prefs-modal></prefs-modal>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="flex-1">
    <!-- NOW PLAYING BANNER -->
    <div id="now-playing" class="hidden max-w-7xl mx-auto px-4 mt-4"></div>

    <!-- HERO SECTION -->
    <section class="relative overflow-hidden border-b border-border-c">
      <div class="absolute inset-0 bg-cover bg-center opacity-30" style="background-image: url('/static/img/wc3_sc2.png')"></div>
      <div class="relative max-w-7xl mx-auto px-4 py-20 md:py-32">
        <h1 class="font-ubuntu text-5xl md:text-7xl font-bold leading-tight">
          LOW PING<br>
          <span class="text-accent-orange">HIGH FUN</span>
        </h1>
        <p class="mt-4 text-lg text-text-muted max-w-lg">
          Get ready for a weekend of wholesome, unhinged gaming
        </p>
        <button id="hero-rsvp-btn" class="btn btn-primary text-lg mt-6 px-6 py-3">
          Confirm your Spot
        </button>
      </div>
    </section>

    <!-- COUNTDOWN -->
    <section class="py-10 border-b border-border-c">
      <div class="max-w-7xl mx-auto px-4 text-center">
        <h2 class="font-mono text-text-muted text-sm mb-4 tracking-widest">COUNTDOWN TO LAUNCH</h2>
        <div id="countdown" class="font-mono text-3xl text-text-muted">Loading...</div>
      </div>
    </section>

    <!-- SCHEDULE -->
    <section id="schedule-section" class="py-10 border-b border-border-c">
      <div class="max-w-7xl mx-auto px-4">
        <h1 class="font-ubuntu text-4xl font-bold mb-6">
          <i class="las la-calendar-alt "></i> Schedule
        </h1>
        <div id="schedule"></div>
      </div>
    </section>

    <!-- EVENT DETAILS -->
    <section class="py-10">
      <div class="max-w-7xl mx-auto px-4 grid md:grid-cols-2 gap-6">
        <h1 class="font-ubuntu text-4xl font-bold mb-6 w-full md:col-span-2">
          <i class="las la-map-marked-alt"></i> Access
        </h1>

        <!-- Location Card -->
        <div class="border border-border-c bg-surface p-6 rounded-kit">
          <h3 class="font-ubuntu text-lg font-bold mb-3">
            <i class="las la-map-marker text-accent-orange"></i> Location
          </h3>
          <p class="text-text-muted mb-3">
            <div id="event-address" class="mb-3 text-accent-green">Loading...</div>
            <a id="event-maps-link" href="#" target="_blank" class=" hover:underline font-mono text-sm">
              [ OPEN IN MAPS ]
            </a>
          </p>
          <p class="text-text-muted tracking-widest mt-3">
            <span>Phone:</span>
            &nbsp;
            <span id="event-contact">Loading...</span>
          </p>
        </div>

        <!-- WiFi Card -->
        <div class="border border-border-c bg-surface p-6 rounded-kit">
          <h3 class="font-ubuntu text-lg font-bold mb-3">
            <i class="las la-wifi text-accent-green"></i> WiFi
          </h3>
          <div class="font-mono">
            <div class="mb-2">
              <span class="text-text-muted text-sm">SSID:</span>
              <span id="wifi-ssid" class="ml-2 text-accent-green">Loading...</span>
            </div>
            <div>
              <span class="text-text-muted text-sm">PASS:</span>
              <button id="wifi-password-btn" class="hitbox-4">
                <span id="wifi-password" class="ml-2 text-text-primary">
                  Loading...
                </span>
              </button>
              <span id="wifi-password-copied" class="p-1 ml-2 bg-green-900 text-lg italic hidden">Copied!</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="border-t border-border-c bg-surface py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 flex justify-between text-text-muted text-sm font-mono">
      <span>Made with <i class="las la-heart"></i> by Sergio Martins</span>
    </div>
  </footer>

  <!-- JS Modules -->
  <script type="module" src="/static/js/common.mjs"></script>
  <script type="module" src="/static/js/app.mjs"></script>
  <script type="module">
    import { initCountdown } from '/static/js/countdown.mjs';
    import { initSchedule, initNowPlaying } from '/static/js/schedule.mjs';
    import { api } from '/static/js/api.mjs';
    import { isLoggedIn } from '/static/js/app.mjs';
    import { openPreferencesModal } from '/static/js/preferences.mjs';

    document.addEventListener('DOMContentLoaded', async () => {
      initCountdown();
      initSchedule();
      initNowPlaying();

      // Load event details into the cards
      try {
        const config = await api.config();
        document.getElementById('event-address').textContent = config.address;
        document.getElementById('event-maps-link').href = config.maps_link;
        document.getElementById('event-contact').textContent = config.contact;
        document.getElementById('wifi-ssid').textContent = config.wifi_ssid;
        document.getElementById('wifi-password').textContent = config.wifi_password;;
        document.getElementById('wifi-password-btn').addEventListener('click', () => {
          navigator.clipboard.writeText(config.wifi_password)
            .then(() => {
              document.getElementById('wifi-password-copied').classList.remove('hidden');
              setTimeout(() => {
                document.getElementById('wifi-password-copied').classList.add('hidden');
              }, 2000);
            })
        });

      } catch (err) {
        console.error('Failed to load config:', err);
      }

      // Hero RSVP button
      const rsvpBtn = document.getElementById('hero-rsvp-btn');
      if (rsvpBtn) {
        rsvpBtn.addEventListener('click', () => {
          if (isLoggedIn()) {
            openPreferencesModal();
          } else {
            document.getElementById('login-modal').classList.remove('hidden');
          }
        });
      }
    });
  </script>
</body>
</html>
